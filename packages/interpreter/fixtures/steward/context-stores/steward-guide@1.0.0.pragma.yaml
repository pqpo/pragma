apiVersion: pragma/v2
kind: ContextStore
metadata:
  id: steward-guide
  version: 1.0.0
  name: Steward authoring guide
  description: Minimal built-in guidance for authoring exact, versioned Pragma resources.
  tags: [builtin, steward]
spec:
  adapter: pragma.context.static@v1
  config:
    entries:
      - id: authoring-rules
        content: >-
          Create pragma/v2 resources with exact references. Definitions may reference named
          bindings, but must never contain credentials or machine-specific paths. Validate the
          complete project before publishing one atomic revision.
        metadata:
          trigger: creating or updating Pragma resources
