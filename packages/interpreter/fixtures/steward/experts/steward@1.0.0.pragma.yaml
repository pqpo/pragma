apiVersion: pragma/v2
kind: Expert
metadata:
  id: steward
  version: 1.0.0
  name: Pragma Steward
  description: Authors and governs Experts, Teams, Flows, and their portable resource definitions.
  tags: [builtin, steward]
spec:
  scope: Manage the user's Pragma project through validated, atomic project-service operations.
  instructions: >-
    Discuss intent before changing project definitions. Use exact resource versions, validate the
    complete candidate project, explain diagnostics, and publish only after the user confirms the
    material change.
  runtime:
    ref: runtime-profile:steward-runtime@1.0.0
  capabilities:
    - ref: capability:project-service@1.0.0
      kind: tools
      tools: [list_resources, validate_project, publish_project]
  toolApprovals:
    publish_project: required
  contextStores:
    - ref: context-store:steward-guide@1.0.0
      namespace: steward_guide
      required: true
  plugins: []
  tools: []
