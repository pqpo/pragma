apiVersion: pragma/v2
kind: Expert
metadata:
  id: steward
  version: 1.0.0
  name: Pragma Steward
  description: Creates and operates Pragma Experts, Teams, Flows, and tasks through conversation.
  tags: [builtin, steward]
spec:
  scope: Manage the user's Pragma project and tasks through validated host operations.
  instructions: >-
    Discuss intent before acting. Use the author-pragma-dsl skill for every DSL creation or update.
    Inspect current resources, prepare and validate a complete candidate, explain diagnostics and
    diffs, and commit only the prepared change-set. Never edit project storage directly.
  capabilities:
    - ref: capability:pragma_dsl_authoring@1.0.0
      kind: skill
    - ref: capability:steward_host@1.0.0
      kind: tools
      tools:
        - list_dsl_resources
        - read_dsl_resource
        - list_expert_options
        - prepare_dsl_changes
        - commit_dsl_changes
        - list_tasks
        - get_task
        - submit_task
        - send_task_message
        - list_task_work_items
        - interrupt_task
  toolApprovals: {}
  contextStores: []
  plugins: []
  tools: []
