appId: com.pqpo.pragma
productName: Pragma
electronLanguages:
  - en
  - en-US
  - en-GB
  - zh-CN
  - zh-TW
  - en_FEMININE
  - en_MASCULINE
  - en_NEUTER
  - en_US
  - en_US_FEMININE
  - en_US_MASCULINE
  - en_US_NEUTER
  - en_GB
  - en_GB_FEMININE
  - en_GB_MASCULINE
  - en_GB_NEUTER
  - zh_CN
  - zh_CN_FEMININE
  - zh_CN_MASCULINE
  - zh_CN_NEUTER
  - zh_TW
  - zh_TW_FEMININE
  - zh_TW_MASCULINE
  - zh_TW_NEUTER
asar: true
beforePack: ./scripts/packaging-policy.mjs
afterPack: ./scripts/audit-packaged-app.mjs
artifactBuildCompleted: ./scripts/packaging-size.mjs
asarUnpack:
  - out/main/claude-acp-worker.js
  - out/main/pragma-command-client.js
  - out/main/desktop-cli/**/*
  - node_modules/@napi-rs/keyring*/**/*
  # The unpacked CLI must resolve Photon and its WASM without ASAR module lookup.
  - node_modules/@silvia-odwyer/photon-node/**/*

directories:
  buildResources: build
  output: dist

files:
  - out/**/*
  - package.json
  - "!**/*.map"
  # Claude Code is installed by the user, including on the target architecture.
  - "!**/node_modules/@anthropic-ai/claude-agent-sdk-*/**/*"
  - "!**/node_modules/@anthropic-ai/claude-code/**/*"
  # Older SDK layouts embed the CLI directly rather than in optional packages.
  - "!**/node_modules/@anthropic-ai/claude-agent-sdk/{claude,claude.exe,cli.js,cli.cjs,cli.mjs}"
  - "!**/node_modules/@anthropic-ai/claude-agent-sdk/vendor/**/*"

extraResources:
  - from: .packaging/third-party-notices
    to: third-party-notices
  - from: .packaging/distribution.json
    to: distribution.json
  - from: build/terminal-integration.ps1
    to: terminal-integration.ps1
  - from: .plugin-bundles/plugins
    to: plugins
  - from: build/icon-mac.png
    to: icons/icon-mac.png
  - from: build/icon-windows.png
    to: icons/icon-windows.png

mac:
  category: public.app-category.developer-tools
  icon: build/icon-mac.png
  identity: null
  hardenedRuntime: false
  files:
    - out/**/*
    - package.json
    - "!**/node_modules/@mariozechner/clipboard-win32-*/**/*"
  target:
    - dmg
    - zip
  artifactName: Pragma-${version}-mac-${arch}.${ext}

win:
  icon: build/icon-windows.png
  files:
    - out/**/*
    - package.json
    - "!**/node_modules/@mariozechner/clipboard-darwin-*/**/*"
    - "!**/node_modules/@mariozechner/clipboard-win32-arm64-msvc/**/*"
  target:
    - nsis
  artifactName: Pragma-${version}-win-${arch}.${ext}

nsis:
  oneClick: false
  perMachine: true
  allowElevation: true
  include: build/installer.nsh
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Pragma
