appId: com.pqpo.pragma
productName: Pragma
asar: true
afterPack: ./scripts/audit-packaged-app.mjs
asarUnpack:
  - out/main/claude-acp-worker.js
  - out/main/pragma-command-client.js
  - out/main/desktop-cli/**/*
  - node_modules/@napi-rs/keyring*/**/*

directories:
  buildResources: build
  output: dist

files:
  - out/**/*
  - package.json
  # Claude Code is installed by the user, including on the target architecture.
  - "!**/node_modules/@anthropic-ai/claude-agent-sdk-*/**/*"
  - "!**/node_modules/@anthropic-ai/claude-code/**/*"
  # Older SDK layouts embed the CLI directly rather than in optional packages.
  - "!**/node_modules/@anthropic-ai/claude-agent-sdk/{claude,claude.exe,cli.js,cli.cjs,cli.mjs}"
  - "!**/node_modules/@anthropic-ai/claude-agent-sdk/vendor/**/*"

extraResources:
  - from: build/terminal-integration.ps1
    to: terminal-integration.ps1
  - from: .plugin-bundles/plugins
    to: plugins
  - from: build/icon-mac.png
    to: icons/icon-mac.png
  - from: build/icon-windows.png
    to: icons/icon-windows.png

mac:
  category: public.app-category.developer-tools
  icon: build/icon-mac.png
  identity: null
  hardenedRuntime: false
  files:
    - "!**/node_modules/@mariozechner/clipboard-win32-*/**/*"
  target:
    - dmg
    - zip
  artifactName: Pragma-${version}-mac-${arch}.${ext}

win:
  icon: build/icon-windows.png
  files:
    - "!**/node_modules/@mariozechner/clipboard-darwin-*/**/*"
    - "!**/node_modules/@mariozechner/clipboard-win32-arm64-msvc/**/*"
  target:
    - nsis
  artifactName: Pragma-${version}-win-${arch}.${ext}

nsis:
  oneClick: false
  perMachine: true
  allowElevation: true
  include: build/installer.nsh
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Pragma
