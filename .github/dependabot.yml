version: 2

updates:
  # pnpm workspaces are managed through the npm ecosystem and the root lockfile.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - javascript
    commit-message:
      prefix: chore(deps)
    ignore:
      # electron-vite 5 supports Vite through v7. Keep Desktop on the newest
      # compatible major until electron-vite publishes Vite 8 support.
      - dependency-name: vite
        update-types:
          - version-update:semver-major
      - dependency-name: "@vitejs/plugin-react"
        update-types:
          - version-update:semver-major
    groups:
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"
      production-minor-and-patch:
        applies-to: version-updates
        dependency-type: production
        update-types:
          - minor
          - patch
      development-minor-and-patch:
        applies-to: version-updates
        dependency-type: development
        update-types:
          - minor
          - patch
