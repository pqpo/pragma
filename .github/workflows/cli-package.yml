name: CLI package verification
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ""
      source_run_id:
        type: string
        default: ""
permissions:
  contents: read
  actions: read
jobs:
  source:
    if: inputs.source_run_id == ''
    uses: ./.github/workflows/verify-source.yml
    with:
      ref: ${{ inputs.ref || github.sha }}
      reuse_ci: true
  build:
    name: Build canonical CLI tarball
    needs: source
    if: always() && (inputs.source_run_id != '' || needs.source.result == 'success')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22.19.0
      - uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source_run_id || needs.source.outputs.run_id }}
          name: pragma-cli-canonical
          path: apps/cli/.release/ci-artifact
      - name: Verify canonical identity and digest
        shell: bash
        run: |
          cd apps/cli/.release/ci-artifact
          sha256sum --check --strict SHA256SUMS.txt
          node --input-type=module -e 'import fs from "node:fs";import cp from "node:child_process";const m=JSON.parse(fs.readFileSync("artifact-manifest.json"));const p=JSON.parse(fs.readFileSync("../../package.json"));if(m.buildIdentity.commit!==cp.execFileSync("git",["rev-parse","HEAD"],{encoding:"utf8"}).trim()||m.package!==p.name||m.version!==p.version)throw Error("Wrong canonical artifact source or version")'
      - uses: actions/upload-artifact@v7
        if: (inputs.source_run_id || needs.source.outputs.run_id) != format('{0}', github.run_id)
        with:
          name: pragma-cli-canonical
          path: apps/cli/.release/ci-artifact
          if-no-files-found: error
          retention-days: 14
  platform:
    name: ${{ matrix.mode }} ${{ matrix.os }} / Node ${{ matrix.node }}
    needs: build
    if: always() && needs.build.result == 'success'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - { os: macos-15, node: "22.x", architecture: arm64, mode: positive }
          - { os: macos-15, node: "24.x", architecture: arm64, mode: positive }
          - { os: macos-15-intel, node: "22.x", architecture: x64, mode: positive }
          - { os: macos-15-intel, node: "24.x", architecture: x64, mode: positive }
          - { os: windows-2025, node: "22.x", architecture: x64, mode: positive }
          - { os: windows-2025, node: "24.x", architecture: x64, mode: positive }
          - { os: macos-15, node: "20.x", architecture: arm64, mode: node20 }
          - { os: windows-2025, node: "20.x", architecture: x64, mode: node20 }
          - { os: ubuntu-24.04, node: "22.x", architecture: x64, mode: linux }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - name: Verify runner architecture
        env:
          EXPECTED_ARCHITECTURE: ${{ matrix.architecture }}
        run: node -e "if (process.arch !== process.env.EXPECTED_ARCHITECTURE) throw new Error('Wrong runner architecture')"
      - uses: actions/download-artifact@v8
        with:
          name: pragma-cli-canonical
          path: apps/cli/.release/ci-artifact
      - name: Prepare isolated macOS keychain
        if: runner.os == 'macOS' && matrix.mode == 'positive'
        shell: bash
        run: |
          keychain_path="${RUNNER_TEMP}/pragma-cli-smoke.keychain-db"
          keychain_password="$(openssl rand -hex 32)"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 3600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          security default-keychain -d user -s "$keychain_path"
      - name: Verify isolated package behavior
        run: node apps/cli/scripts/smoke-package.mjs --mode ${{ matrix.mode }} --artifact-dir apps/cli/.release/ci-artifact
      - name: Verify Windows pnpm argument handling
        if: runner.os == 'Windows' && matrix.mode == 'positive'
        run: node --test scripts/pnpm-command.test.mjs
      - name: Remove isolated macOS keychain
        if: always() && runner.os == 'macOS' && matrix.mode == 'positive'
        shell: bash
        run: |
          keychain_path="${RUNNER_TEMP}/pragma-cli-smoke.keychain-db"
          if [[ -f "$keychain_path" ]]; then security delete-keychain "$keychain_path"; fi

  result:
    needs: [build, platform]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require canonical identity and every supported/negative platform gate
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          PLATFORM_RESULT: ${{ needs.platform.result }}
        run: test "$BUILD_RESULT" = success && test "$PLATFORM_RESULT" = success
