name: CI

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".gitignore"
      - "LICENSE"
  pull_request:
    branches:
      - main
      - master
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".gitignore"
      - "LICENSE"

# Cancel in-progress jobs for the same branch/PR to prevent queuing
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
jobs:
  source:
    uses: ./.github/workflows/verify-source.yml
    with:
      ref: ${{ github.sha }}
  cli-package:
    needs: source
    uses: ./.github/workflows/cli-package.yml
    with:
      ref: ${{ github.sha }}
      source_run_id: ${{ needs.source.outputs.run_id }}
  verify:
    needs: [source, cli-package]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - env:
          SOURCE_RESULT: ${{ needs.source.result }}
          CLI_RESULT: ${{ needs.cli-package.result }}
        run: test "$SOURCE_RESULT" = success && test "$CLI_RESULT" = success
