packages:
  - "apps/*"
  - "packages/*"
  - "packages/runtime/*"
  - "plugins/*"
  - "examples"
# These are deprecated transitive dependencies of current upstream releases
# (electron-builder and @google/genai), not packages selected by this workspace.
allowedDeprecatedVersions:
  boolean: 3.2.0
  glob: 7.2.3
  inflight: 1.0.6
  node-domexception: 1.0.0
  rimraf: 2.6.3

supportedArchitectures:
  os:
    - current
    - darwin
    - win32
  cpu:
    - current
    - x64
    - arm64
